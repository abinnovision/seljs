# $schema: https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    open-pull-requests-limit: 15
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "build(deps)"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "typescript"
        versions: ["7.0.x"]
      # Pinned via root resolutions; newer releases change the type registration API.
      - dependency-name: "@marcbachmann/cel-js"
        versions: [">=7.6.0"]
      # 0.23 inlines dependency types into dist/node_modules; needs a config migration.
      - dependency-name: "tsdown"
        versions: [">=0.23.0"]
    groups:
      production-dependencies:
        dependency-type: production
        patterns: ["*"]
      development-dependencies:
        dependency-type: development
        patterns: ["*"]
